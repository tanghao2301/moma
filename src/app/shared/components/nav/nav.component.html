<nav
  class="nav-bar w-64 bg-white py-6 border-r border-[#bec9c2] flex flex-col justify-between"
  aria-label="Main navigation"
>
  <div>
    <div class="px-6 mb-8">
      <h1 class="text-xl font-bold text-primary tracking-tight">WealthGuard</h1>
      <p class="text-[10px] font-bold text-color-secondary uppercase tracking-widest opacity-70">Institutional Grade</p>
    </div>
    
    <ul class="space-y-1 overflow-y-auto px-2">
      @for(url of commonService.urls; track url.title) {
      <li>
        <a
          class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-gray-50 cursor-pointer no-underline text-color-secondary font-medium text-sm"
          [routerLink]="url.url"
          routerLinkActive="active-link"
        >
          <i [class]="'pi ' + url.icon"></i>
          <span>{{ url.title }}</span>
        </a>
      </li>
      }
    </ul>
  </div>
  <div class="px-2 mt-auto border-t border-[#bec9c2] pt-4">
    <a
      class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all hover:bg-gray-50 cursor-pointer no-underline text-color-secondary font-medium text-sm"
      [routerLink]="'/login'"
    >
      <i class="pi pi-sign-out"></i>
      <span>Sign Out</span>
    </a>
  </div>
</nav>
